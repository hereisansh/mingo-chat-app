services:
  - type: web
    name: mingo-chat-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STUDY_AI_PROVIDER
        value: gemini
